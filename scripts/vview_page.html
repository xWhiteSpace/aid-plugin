<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V-model debug view</title>
<style>
:root {
  --bg: #020617;
  --ink: #f1f5f9;
  --muted: #94a3b8;
  --line: #1e293b;
  --cyan: #22d3ee;
  --focus: #ecfeff;
  --pass: #34d399;
  --fail: #fb7185;
  --skip: #fbbf24;
  --idle: #64748b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.shell { display: flex; flex-direction: column; height: 100%; max-width: 72rem; width: 100%; margin: 0 auto; padding: 20px 24px; gap: 16px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
.head h1 { margin: 0; font-size: 15px; font-weight: 600; }
.head p { margin: 0; color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip {
  border: 1px solid #334155; background: transparent; color: #cbd5e1;
  border-radius: 999px; padding: 4px 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
}
.chip:hover { border-color: #64748b; color: #fff; }
.chip[aria-pressed="true"], .chip.on { background: #f1f5f9; color: #0f172a; border-color: #cbd5e1; }
.chip.cyan { border-color: rgba(34,211,238,.4); color: #cffafe; }
.chip.cyan:hover, .chip.cyan.on { border-color: #a5f3fc; color: #fff; }
.chip.cyan.on { background: #cffafe; color: #0f172a; }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.card { border: 1px solid var(--line); background: rgba(15,23,42,.7); border-radius: 16px; padding: 16px 20px; flex-shrink: 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.stat { text-align: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: rgba(2,6,23,.6); }
.stat b { display: block; font-size: 20px; }
.stat span { display: block; margin-top: 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.cam-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.globe {
  position: absolute; left: 16px; bottom: 16px; z-index: 20;
  width: 40px; height: 40px; display: grid; place-items: center;
  border-radius: 999px; border: 1px solid rgba(34,211,238,.4);
  background: rgba(2,6,23,.8); color: #cffafe;
}
.globe:hover { border-color: #a5f3fc; color: #fff; }
.globe:disabled { opacity: .4; }
.vv-world {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  perspective: 520px; perspective-origin: 50% 18%;
}
.vv-floor {
  position: absolute; left: 50%; top: 28%; width: 200%; height: 160%;
  transform: translateX(-50%) rotateX(74deg); transform-origin: center top;
}
.vv-floor-near {
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 28%, #000 48%, #000 90%, transparent 98%);
  mask-image: linear-gradient(to bottom, transparent 0%, transparent 28%, #000 48%, #000 90%, transparent 98%);
}
.vv-floor-far {
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 22%, transparent 40%);
  mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 22%, transparent 40%);
}
.vv-floor-snakes { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
.vv-floor-grid { fill: none; stroke-width: 1.15; }
.vv-floor-near .vv-floor-grid { stroke: rgba(34, 211, 238, 0.38); }
.vv-floor-far .vv-floor-grid { stroke: rgba(22, 101, 52, 0.7); }
.vv-snake-trail, .vv-snake-core {
  fill: none; stroke-linecap: square; stroke-linejoin: miter;
  animation: vv-snake 9s linear infinite;
}
.vv-run-a { stroke: #22d3ee; }
.vv-run-b { stroke: #67e8f9; }
.vv-run-b .vv-snake-trail, .vv-run-b .vv-snake-core { animation-duration: 13s; animation-delay: -5s; }
.vv-snake-trail { stroke-width: 3; opacity: 0.08; stroke-dasharray: 260 1740; }
.vv-snake-core { stroke-width: 1.25; opacity: 0.22; stroke-dasharray: 120 1880; }
@keyframes vv-snake { to { stroke-dashoffset: -2000; } }
.vv-world-shade {
  position: absolute; inset: 0 0 auto; height: 52%;
  background: linear-gradient(to bottom, rgba(2, 6, 23, 0.88), rgba(2, 6, 23, 0.35) 70%, transparent);
}
.vv-horizon {
  position: absolute; left: 0; right: 0; top: 26%; height: 1px;
  background: linear-gradient(to right, transparent, rgba(22, 101, 52, 0.7), transparent);
  box-shadow: 0 0 12px rgba(20, 83, 45, 0.4);
}
.vv-camera { position: relative; z-index: 1; height: 100%; min-height: 22rem; }
.vv-camera[data-hot="true"] { cursor: pointer; }
.vv-camera[data-busy="true"] { pointer-events: none; }
.vv-scene {
  transform: translate3d(0px, 0px, 0px) scale(1);
  transition: transform 600ms cubic-bezier(0.22, 0.61, 0.36, 1);
  margin: 0 auto; width: 100%; max-width: 64rem; padding: 48px 160px 24px;
}
.vv-stage { position: relative; width: 100%; aspect-ratio: 1160 / 892; }
.vv-svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.vv-rail {
  fill: none; stroke: #22d3ee; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 0 3px #22d3ee) drop-shadow(0 0 10px #0891b2);
}
.vv-cross {
  fill: none; stroke-width: 1.2; stroke-linecap: round; opacity: 0.45;
  filter: drop-shadow(0 0 4px #22d3ee);
}
.vv-dot { filter: drop-shadow(0 0 3px currentColor); }
.vv-halo { fill: none; stroke-width: 1.4; opacity: 0.95; filter: url(#vv-bloom); animation: vv-halo 1.15s ease-in-out infinite; }
@keyframes vv-halo { 50% { opacity: 0.4; } }
.vv-bloom { opacity: 0.35; filter: url(#vv-bloom); }
.vv-pulse { fill: none; stroke: #ecfeff; stroke-width: 2.8; stroke-dasharray: 18 64; stroke-linecap: round; animation: vv-dash 2.2s linear infinite; }
@keyframes vv-dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -82; } }
button.vv-node {
  position: absolute; z-index: 1; width: 40px; height: 40px; margin: 0; padding: 0;
  border: none; background: transparent; cursor: pointer; pointer-events: none;
  transform: translate(-50%, -50%);
}
.vv-lab-l, .vv-lab-r {
  position: absolute; top: 50%; width: max-content; max-width: 9.5rem;
  transform: translateY(-50%); transition: color 160ms ease, text-shadow 160ms ease;
}
.vv-lab-l { right: calc(100% + 12px); text-align: right; }
.vv-lab-r { left: calc(100% + 12px); text-align: left; }
.vv-lab-a { left: 50%; right: auto; bottom: calc(100% + 10px); top: auto; text-align: center; transform: translateX(-50%); }
.vv-lab-t { display: block; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: rgba(207,250,254,.9); }
.vv-lab-r .vv-lab-t { color: #fff; }
.vv-sub { margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 10px; line-height: 1.2; }
.vv-lab-l .vv-sub { justify-content: flex-end; font-family: ui-monospace, monospace; color: rgba(165,243,252,.8); }
.vv-lab-a .vv-sub { justify-content: center; }
button.vv-node[data-hot="true"] .vv-lab-l, button.vv-node[data-hot="true"] .vv-lab-r,
button.vv-node:focus-visible .vv-lab-l, button.vv-node:focus-visible .vv-lab-r {
  color: #ecfeff; text-shadow: 0 0 12px rgba(34,211,238,.65);
}
.vv-coding { position: absolute; z-index: 1; transform: translate(-50%, 10px); pointer-events: none; }
.vv-coding span { display: block; text-align: center; font-size: 10px; letter-spacing: .32em; text-transform: uppercase; color: rgba(165,243,252,.8); }
.pane { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
.list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; }
.item {
  display: block; width: 100%; text-align: left; border: 1px solid #1e293b;
  background: rgba(15,23,42,.4); color: inherit; border-radius: 16px; padding: 12px 16px;
  user-select: none;
}
.item:hover { border-color: rgba(6,182,212,.5); }
.item[data-hot="true"] { border-color: rgba(34,211,238,.4); background: rgba(15,23,42,.5); }
.item[data-peek="true"] { border-color: #67e8f9; background: rgba(15,23,42,.7); }
.item h3 { margin: 0; font-size: 14px; font-weight: 500; }
.item .id { margin-top: 2px; font-family: ui-monospace, monospace; font-size: 10px; color: #64748b; }
.pill { border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 500; flex-shrink: 0; }
.s-passed { background: rgba(52,211,153,.15); color: #6ee7b7; }
.s-failed { background: rgba(251,113,133,.15); color: #fda4af; }
.s-skipped { background: rgba(251,191,36,.15); color: #fde68a; }
.s-not_run { background: #1e293b; color: #94a3b8; }
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #020617; }
.ov-head { display: flex; flex-direction: column; gap: 8px; padding: 12px 20px; flex-shrink: 0; }
.split { display: flex; flex: 1; min-height: 0; }
.side { overflow: auto; padding: 24px 20px; flex-shrink: 0; }
.sep { width: 6px; flex-shrink: 0; cursor: col-resize; background: rgba(34,211,238,.15); }
.sep:hover { background: rgba(103,232,249,.4); }
.field { flex: 1; min-width: 0; min-height: 0; position: relative; }
.field svg { width: 100%; height: 100%; display: block; }
.grab { cursor: grab; }
.grab:active { cursor: grabbing; }
.kind { font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: rgba(165,243,252,.8); }
.side h2 { margin: 8px 0 0; font-size: 20px; }
.stmt { color: #cbd5e1; font-size: 14px; line-height: 1.5; }
.ids { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.ids button, .tabx {
  border: 1px solid #334155; background: none; color: #cbd5e1; border-radius: 999px;
  padding: 2px 8px; font-family: ui-monospace, monospace; font-size: 10px;
  user-select: none;
}
.ids button:hover, .tabx:hover { border-color: #22d3ee; color: #fff; }
.tabx.on { background: #cffafe; color: #0f172a; border-color: #cffafe; }
.zoom {
  position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 6px;
}
.zoom button {
  min-width: 2.75rem; height: 2.75rem; border-radius: 999px; border: 1px solid rgba(34,211,238,.3);
  background: #0b1220; color: #a5f3fc; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
}
.zoom button:hover { border-color: rgba(165,243,252,.7); color: #ecfeff; }
.hint { color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); padding: 24px 4px; }
pre { background: #020617; border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow: auto; font-size: 10px; color: #ecfeff; }
.flags { color: #fde68a; }
.foot { padding: 0 24px 12px; color: var(--muted); font-size: 11px; flex-shrink: 0; max-width: 72rem; width: 100%; margin: 0 auto; }
.note { width: 100%; resize: vertical; border-radius: 16px; border: 1px solid #1e293b; background: #020617; padding: 8px 12px; }
.note:focus { border-color: rgba(6,182,212,.5); outline: none; }
@keyframes vv-in {
  from { opacity: 0; transform: translate3d(0, 8px, 0) scale(0.98); }
  to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
}
.vv-in { animation: vv-in 280ms cubic-bezier(0.22, 0.61, 0.36, 1); }
@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .vv-scene { padding: 32px 48px 16px; }
  .split { flex-direction: column; }
  .side { width: 100% !important; max-height: 40%; }
  .vv-lab-l, .vv-lab-r { max-width: 6.5rem; }
}
@media (prefers-reduced-motion: reduce) {
  .vv-scene { transition: none !important; }
  .vv-pulse, .vv-snake-trail, .vv-snake-core, .vv-halo, .vv-in { animation: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = __DATA__;
(function () {
  const STATUS_COLOR = { passed: "#34d399", failed: "#fb7185", skipped: "#fbbf24", not_run: "#64748b" };
  const STATUS_LABEL = { passed: "Passed", failed: "Failed", skipped: "Skipped", not_run: "Not run" };
  const KIND_COLOR = { USR: "#a5f3fc", REQ: "#67e8f9", FNC: "#22d3ee", API: "#818cf8", INT: "#93c5fd", CMP: "#c084fc", UNT: "#34d399", TST: "#fbbf24" };
  const V_VIEW = { x: -160, y: -72, w: 1160, h: 892 };
  const USR_HUB = { level: "needs", left: "USR", right: "", lx: -90, ly: 70, z: 80, leftOnly: true };
  const V_ROWS = [
    { level: "acceptance", left: "Requirements", right: "Acceptance test", lx: 120, ly: 70, rx: 880, ry: 70, z: 64, labelAbove: true },
    { level: "system", left: "Functional", right: "System test", lx: 220, ly: 230, rx: 780, ry: 230, z: 16 },
    { level: "integration", left: "System", right: "Integration", lx: 320, ly: 390, rx: 680, ry: 390, z: -28 },
    { level: "unit", left: "Unit", right: "Unit test", lx: 400, ly: 550, rx: 600, ry: 550, z: -76 }
  ];
  const CODING = { x: 500, y: 720, z: -120 };
  const RAIL_CYAN = "#22d3ee";
  const DOLLY_MS = 600;
  const LEFT_KINDS = { needs: ["USR"], acceptance: ["REQ"], system: ["FNC", "API"], integration: ["INT", "CMP"], unit: ["UNT"] };
  const RING_ORDER = ["USR", "REQ", "FNC", "API", "CMP", "UNT", "TST"];
  const FOCUS_TABS = [
    { id: "Connections", kind: null },
    { id: "USR", kind: "USR" }, { id: "REQ", kind: "REQ" }, { id: "FNC", kind: "FNC" },
    { id: "API", kind: "API" }, { id: "CMP", kind: "CMP" }, { id: "UNT", kind: "UNT" },
    { id: "Tests", kind: "TST" }
  ];
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const VIEW = { w: 1100, h: 720, cx: 550, cy: 360 };
  const WORLD = { w: 1960, h: 1440 };
  const V_SCALE = 1.65, V_OX = 340, V_OY = 70;
  const ZOOM_MIN = 0.7, ZOOM_MAX = 8, MAG_PX = 56, MAG_MAX = 3, DRAG_PX = 6;
  const PANEL_MIN = 224, PANEL_MAX = 720, PANEL_DEFAULT = 320, PANEL_KEY = "aid-vview-panel-w";
  const REVIEW_KEY = "aid-vview-review-v1";
  const VERDICTS = [{ id: "keep", label: "Keep" }, { id: "rewrite", label: "Rewrite" }, { id: "reject", label: "Reject" }];
  const FLOOR = { w: 2240, h: 1400, g: 56 };
  const GLOBE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>';

  function vxy(x, y) { return { x: V_OX + x * V_SCALE, y: V_OY + y * V_SCALE }; }
  function railPoints(side) {
    const start = side === "left" ? [USR_HUB.lx + "," + USR_HUB.ly] : [];
    return start.concat(V_ROWS.map(function (row) {
      return side === "left" ? row.lx + "," + row.ly : row.rx + "," + row.ry;
    })).concat([CODING.x + "," + CODING.y]).join(" ");
  }
  const LEFT_RAIL = railPoints("left");
  const RIGHT_RAIL = railPoints("right");
  function floorGridPath() {
    const parts = [];
    for (let x = 0; x <= FLOOR.w; x += FLOOR.g) parts.push("M" + x + " 0 V" + FLOOR.h);
    for (let y = 0; y <= FLOOR.h; y += FLOOR.g) parts.push("M0 " + y + " H" + FLOOR.w);
    return parts.join(" ");
  }
  const FLOOR_GRID_PATH = floorGridPath();
  const WORLD_LEFT = [
    { key: "USR", kind: "USR", label: "USR", ...vxy(-180, 70) },
    { key: "REQ", kind: "REQ", label: "REQ", ...vxy(120, 70) },
    { key: "FNC", kind: "FNC", label: "FNC", ...vxy(220, 230) },
    { key: "API", kind: "API", label: "API", ...vxy(290, 370) },
    { key: "CMP", kind: "CMP", label: "CMP", ...vxy(350, 420) },
    { key: "UNT", kind: "UNT", label: "UNT", ...vxy(400, 550) }
  ];
  const WORLD_RIGHT = [
    { key: "TST-acceptance", kind: "TST", level: "acceptance", label: "Acceptance", ...vxy(880, 70) },
    { key: "TST-system", kind: "TST", level: "system", label: "System", ...vxy(780, 230) },
    { key: "TST-integration", kind: "TST", level: "integration", label: "Integration", ...vxy(680, 390) },
    { key: "TST-unit", kind: "TST", level: "unit", label: "Unit", ...vxy(600, 550) }
  ];
  const WORLD_CODING = { ...vxy(500, 720), label: "Coding" };
  const WORLD_RAIL_L_PTS = [vxy(-180, 70), vxy(120, 70), vxy(220, 230), vxy(320, 390), vxy(400, 550), WORLD_CODING].map(function (p) { return p.x + "," + p.y; }).join(" ");
  const WORLD_RAIL_R_PTS = [vxy(880, 70), vxy(780, 230), vxy(680, 390), vxy(600, 550), WORLD_CODING].map(function (p) { return p.x + "," + p.y; }).join(" ");
  const WORLD_HUBS = WORLD_LEFT.concat(WORLD_RIGHT);
  const WORLD_ORDER = ["USR", "REQ", "FNC", "API", "CMP", "UNT", "TST"];

  const S = {
    project: (DATA.projects && DATA.projects[0]) || "",
    active: null,
    pane: "tests",
    reviewing: false,
    filter: "All",
    focusId: null,
    startWorld: false,
    pages: [],
    pageI: 0,
    hot: null,
    cam: { x: 0, y: 0, k: 1 },
    panelW: PANEL_DEFAULT,
    reviewI: 0,
    note: "",
    snippet: null,
    openFile: null
  };
  const nodeRefs = {};
  const poseRef = { current: null };
  const lockRef = { current: false };
  const timerRef = { current: null };
  const dragRef = { current: null };
  const resizeRef = { current: null };
  const lastTapRef = { current: { t: 0, id: null } };
  const cursorRef = { current: null };
  const fieldRef = { current: { points: [], byId: {} } };
  let dolly = null;
  let landingHot = null;
  const root = document.getElementById("app");

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function prefersReducedMotion() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }
  function nodeKey(level, side) { return level + ":" + side; }
  function sameHot(hot, level, side) { return Boolean(hot && hot.level === level && hot.side === side); }
  function emptyTotals() { return { passed: 0, failed: 0, skipped: 0, not_run: 0 }; }
  function nodesOf() {
    return Object.keys(DATA.nodes).map(function (id) { return DATA.nodes[id]; }).filter(function (n) {
      return !S.project || n.project === S.project;
    });
  }
  function byKinds(kinds) {
    return nodesOf().filter(function (n) { return kinds.indexOf(n.kind) >= 0; }).sort(function (a, b) { return a.id.localeCompare(b.id, "en"); });
  }
  function testsOf(level) {
    return nodesOf().filter(function (n) { return n.kind === "TST" && (n.level || "unit") === level; }).sort(function (a, b) { return a.id.localeCompare(b.id, "en"); });
  }
  function tracesOf() {
    const ids = {};
    nodesOf().forEach(function (n) { ids[n.id] = true; });
    return (DATA.traces || []).filter(function (t) { return ids[t.id]; });
  }
  function tstStatus(n) {
    const s = (n && n.status) || "not_run";
    if (s === "passed" || s === "failed" || s === "skipped") return s;
    return "not_run";
  }
  function totalsFor(list) {
    const c = emptyTotals();
    (list || []).forEach(function (n) { c[tstStatus(n)] += 1; });
    return c;
  }
  function allTotals() { return totalsFor(nodesOf().filter(function (n) { return n.kind === "TST"; })); }
  function toneOf(c) {
    const safe = c || emptyTotals();
    if (safe.failed) return STATUS_COLOR.failed;
    if (safe.passed && !safe.not_run) return STATUS_COLOR.passed;
    if (safe.skipped && !safe.passed) return STATUS_COLOR.skipped;
    return RAIL_CYAN;
  }
  function pctX(x) { return ((x - V_VIEW.x) / V_VIEW.w) * 100 + "%"; }
  function pctY(y) { return ((y - V_VIEW.y) / V_VIEW.h) * 100 + "%"; }
  function domainOf(n) { return n.domain || n.type || n.who || ""; }
  function artifact(id) {
    const n = DATA.nodes[id] || {};
    return { title: n.title || id, statement: n.statement || "", acceptance: n.acceptance || "", domain: domainOf(n) };
  }
  function outs(id, type) {
    return DATA.edges.filter(function (e) { return e.from === id && (!type || e.type === type); }).map(function (e) { return e.to; });
  }
  function ins(id, type) {
    return DATA.edges.filter(function (e) { return e.to === id && (!type || e.type === type); }).map(function (e) { return e.from; });
  }
  function unique(ids) {
    const seen = {}; const out = [];
    (ids || []).forEach(function (id) { if (id && !seen[id]) { seen[id] = true; out.push(id); } });

  function levelView() {
    const row = rowOf(S.active);

    const shown = S.filter === "All" ? checks : checks.filter(function (c) { return c.domain === S.filter; });
    const cards = shown.length ? shown.map(function (check) {
      const cases = (check.cases || []).map(function (line, i) {

      "<h2 style=\"margin:4px 0 0;font-size:18px\">" + esc(row.right) + "</h2><p class=\"hint\">" + esc(summaryLine(totalsFor(testsOf(S.active)))) + "</p>" +

  function reviewView(items, kinds) {
    const queue = queueFor(items);

          (ids.length ? '<div class="ids">' + ids.map(function (id) {

        '<label style="display:block;margin-top:24px"><span class="kind">Note</span><textarea class="note" data-role="note" rows="3">' + esc(S.note) + "</textarea></label>" +
        '<div class="row" style="margin-top:16px">' + VERDICTS.map(function (v) {

          return '<button type="button" class="chip' + (on ? " on" : "") + '" data-act="verdict" data-val="' + v.id + '" aria-pressed="' + on + '">' + v.label + "</button>";
        }).join("") + '<button type="button" class="chip cyan" data-act="focus" data-id="' + esc(current.id) + '">Neighborhood</button></div>';
    }
    return header("") + '<div class="pane"><div><button type="button" class="chip" data-act="close-review">Close review</button>' +
      '<p class="kind" style="margin-top:12px">Human review · not SSOT</p><h2 style="margin:4px 0 0;font-size:18px">Review queue</h2>' +
      '<p class="hint" style="font-family:ui-monospace,monospace">' + reviewed + " / " + queue.length + " " + esc(kindLabel) + "</p>" +
      '<div class="row" style="justify-content:flex-end"><button type="button" class="chip" data-act="rev" data-d="-1"' + (queue.length ? "" : " disabled") + ">Prev</button>" +
      '<button type="button" class="chip" data-act="rev" data-d="1"' + (queue.length ? "" : " disabled") + ">Next</button></div></div>" +
      '<div class="list">' + body + "</div></div>";
  }

  function page() {
    return S.pages[S.pageI] || S.pages[0] || makePage(S.focusId);
  }

  function buildFocusCopy() {
    const pg = page();
    const index = buildIndex();
    const focusId = pg.focusId || S.focusId;
    const world = Boolean(pg.world);
    const peekId = pg.peekId || null;
    const linkId = pg.linkId || null;
    const graph = focusGraph(index, focusId);
    const center = graph.center;
    const hot = S.hot;
    const previewId = hot || peekId || (world ? null : focusId);
    const previewNode = previewId ? (index.nodes[previewId] || (previewId.indexOf("code:") === 0 ? { id: previewId, kind: "UNT", label: previewId } : { id: previewId, kind: kindOfId(previewId), label: previewId })) : null;
    const previewMeta = previewId && DATA.nodes[previewId] ? artifact(previewId) : {};
    const canGoto = Boolean(peekId) && (world || peekId !== focusId) && DATA.nodes[peekId];
    const peekGraph = (world && linkId) ? focusGraph(index, linkId) : null;
    const related = { counts: {}, spokes: [] };
    if (peekGraph) {
      peekGraph.RING_ORDER.forEach(function (kind) {
        const nodes = peekGraph.rings[kind];
        if (!nodes.length) return;
        related.counts[kind] = nodes.length;
        nodes.forEach(function (node) { related.spokes.push(node.id); });
      });
    }
    const lin = previewId && DATA.nodes[previewId] ? lineageOf(previewId) : { grain: null, functions: [], components: [], interfaces: [], units: [], requirements: [], files: [] };
    function lineageRow(caption, empty, items) {
      return '<div style="margin-top:24px"><p class="kind">' + esc(caption) + "</p>" +
        (items.length ? '<div class="ids">' + items.map(function (item) {
          return '<button type="button" data-act="peek" data-open-tab="1" data-id="' + esc(item.id) + '">' + esc(item.label && item.label !== item.id ? item.label : item.id) + "</button>";
        }).join("") + "</div>" : '<p class="hint" style="margin-top:12px">' + esc(empty) + "</p>") + "</div>";
    }
    let copy = '<p class="kind">' + (world ? "World" + (previewNode ? " · " + esc(previewNode.kind) : "") : esc((previewNode && previewNode.kind) || center.kind)) + (hot ? " · Hover" : peekId ? " · Selected" : "") + "</p>";
    copy += "<h2>" + esc(previewNode ? (previewMeta.title || previewNode.label || previewId) : "Entire neighborhood") + "</h2>";
    if (previewId) copy += '<p class="id">' + esc(previewId) + "</p>";
    if (!previewNode) copy += '<p class="hint" style="margin-top:16px">Hover a node to preview. Click to select.</p>';
    if (previewMeta.domain) copy += '<p class="hint" style="margin-top:12px;letter-spacing:.14em;text-transform:uppercase;font-size:11px">' + esc(previewMeta.domain) + "</p>";
    if (previewMeta.statement) copy += '<p class="stmt" style="margin-top:16px">' + esc(previewMeta.statement) + "</p>";
    if (previewNode && !previewMeta.statement && (canGoto || (previewNode.label && previewNode.label !== previewId))) {
      copy += '<p class="hint" style="margin-top:16px">' + esc(previewNode.label && previewNode.label !== previewId ? previewNode.label : "No statement on this node. Goto opens its neighborhood.") + "</p>";
    }
    if (canGoto || peekId) {
      copy += '<div class="row" style="margin-top:24px">';
      if (canGoto) copy += '<button type="button" class="chip on" data-act="goto">Goto</button>';
      if (peekId) copy += '<button type="button" class="chip" data-act="clear-peek">Clear</button>';
      if (world && peekId) copy += '<button type="button" class="chip cyan' + (linkId === peekId ? " on" : "") + '" data-act="see-link">' + (linkId === peekId ? "Hide connection" : "See connection") + (linkId === peekId && related.spokes.length ? " " + related.spokes.length : "") + "</button>";
      copy += "</div>";
    }
    if (world && linkId) {
      copy += '<p class="hint" style="margin-top:16px;font-family:ui-monospace,monospace">Frozen on ' + esc(linkId) + ". " +
        (related.spokes.length === 0 ? "No traced neighbors for this node." : WORLD_ORDER.filter(function (k) { return related.counts[k]; }).map(function (k) { return k + " " + related.counts[k]; }).join(" · ")) + "</p>";
    }
    if (previewNode && lin.grain === "need") copy += lineageRow("Satisfied by", "No functions allocated to this need.", lin.functions);
    if (previewNode && lin.grain === "allocation") {
      copy += lineageRow("Allocated to", "No component allocated.", lin.components);
      copy += lineageRow("Refined by", "No units refine this function.", lin.units);
      copy += lineageRow("Satisfies", "No requirements on this function.", lin.requirements);
    }
    if (previewNode && lin.grain === "architecture") {
      copy += '<p class="kind" style="margin-top:32px">Architecture</p>';
      copy += lineageRow("Functions", "No functions allocated to this block.", lin.functions);
      copy += lineageRow("Ports", "No interfaces on this block.", lin.interfaces);
      copy += lineageRow("Parts", "No units in this block.", lin.units);
    }
    if (previewNode && lin.grain === "contract") {
      copy += lineageRow("Connects", "No components on this contract.", lin.components);
      copy += lineageRow("Used by", "No functions use this contract.", lin.functions);
    }
    if (previewNode && lin.grain === "unit") {
      copy += '<div style="margin-top:32px"><p class="kind">Code</p>';
      if (!lin.files.length) copy += '<p class="hint" style="margin-top:12px">No source files on this unit yet.</p>';
      else copy += '<div class="ids" style="margin-top:12px">' + lin.files.map(function (file, i) {
        return (i ? '<span style="color:#475569">→</span>' : "") + '<button type="button" data-act="open-file" data-path="' + esc(file.path) + '" data-symbol="' + esc(file.symbol || "") + '">' + esc(String(file.path).split("/").pop()) + "</button>";
      }).join("") + "</div>";
      if (S.openFile) {
        const hit = lin.files.filter(function (f) { return f.path === S.openFile.path && (f.symbol || "") === (S.openFile.symbol || ""); })[0];
        if (hit && hit.snippet) copy += "<pre style=\"margin-top:16px\"><p style=\"color:#64748b;margin:0 0 8px\">" + esc(hit.path) + (hit.start ? ":" + hit.start + "–" + hit.end : "") + "</p>" + esc(hit.snippet) + "</pre>";
        else if (hit) copy += '<p class="hint" style="margin-top:12px">Could not read that file.</p>';
      }
      copy += "</div>";
    }
    return copy;
  }
  function refreshCopy() {
    const el = document.getElementById("copy");
    if (el) el.innerHTML = buildFocusCopy();
  }

  function focusHtml() {
    const pg = page();
    const index = buildIndex();
    const focusId = pg.focusId || S.focusId;
    const tab = pg.section || "Connections";
    const world = Boolean(pg.world);
    const blankWorld = Boolean(pg.blankWorld);
    const peekId = pg.peekId || null;
    const linkId = pg.linkId || null;
    const graph = focusGraph(index, focusId);
    const worldMap = placeWorld(index);
    const censusRings = worldRings(index.nodes);
    const center = graph.center;
    const hot = S.hot;
    const peekGraph = (world && linkId) ? focusGraph(index, linkId) : null;
    const related = { ids: {}, counts: {}, spokes: [], links: [] };
    if (peekGraph) {
      peekGraph.RING_ORDER.forEach(function (kind) {
        const nodes = peekGraph.rings[kind];
        if (!nodes.length) return;
        related.counts[kind] = nodes.length;
        nodes.forEach(function (node) { related.ids[node.id] = true; related.spokes.push(node.id); });
      });
      related.links = peekGraph.links;
    }
    const activeKinds = graph.RING_ORDER.filter(function (kind) { return graph.rings[kind].length > 0; });
    const localPoints = [];
    const localById = {};
    localById[center.id] = Object.assign({}, center, { x: VIEW.cx, y: VIEW.cy });
    activeKinds.forEach(function (kind, ringIndex) {
      const radius = 150 + ringIndex * (activeKinds.length > 1 ? 160 / (activeKinds.length - 1) : 0);
      placeRing(graph.rings[kind], radius, VIEW).forEach(function (node) {
        localPoints.push(node);
        localById[node.id] = node;
      });
    });
    const listKind = (FOCUS_TABS.filter(function (t) { return t.id === tab; })[0] || {}).kind;
    const listRings = world ? censusRings : graph.rings;
    const list = listKind ? (listRings[listKind] || []) : [];
    const showTabs = S.pages.length > 1 || !(world && blankWorld);
    const field = world ? worldMap : { points: localPoints, byId: localById };
    const camera = world ? WORLD : VIEW;
    const selectedId = blankWorld ? null : focusId;
    const pin = selectedId ? field.byId[selectedId] : null;
    const peek = peekId ? field.byId[peekId] : null;
    const linkNode = linkId ? field.byId[linkId] : null;
    const viewBox = world
      ? (S.cam.x + " " + S.cam.y + " " + (camera.w / S.cam.k) + " " + (camera.h / S.cam.k))
      : "0 0 " + camera.w + " " + camera.h;
    const copy = buildFocusCopy();

    let svg = '<svg id="field-svg" viewBox="' + viewBox + '" preserveAspectRatio="xMidYMid meet">';
    if (world) {
      svg += '<polyline points="' + WORLD_RAIL_L_PTS + '" fill="none" stroke="rgba(34,211,238,0.08)" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"></polyline>';
      svg += '<polyline points="' + WORLD_RAIL_R_PTS + '" fill="none" stroke="rgba(34,211,238,0.08)" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"></polyline>';
      svg += '<circle cx="' + WORLD_CODING.x + '" cy="' + WORLD_CODING.y + '" r="7" fill="#22d3ee" opacity="0.55"></circle>';
      svg += '<text x="' + WORLD_CODING.x + '" y="' + (WORLD_CODING.y + 22) + '" text-anchor="middle" fill="#67e8f9" font-size="12" font-family="ui-monospace, monospace" opacity="0.45">Coding</text>';
      WORLD_HUBS.forEach(function (hub) {
        svg += '<text x="' + hub.x + '" y="' + (hub.y - 18) + '" text-anchor="middle" fill="' + (KIND_COLOR[hub.kind] || "#67e8f9") + '" font-size="13" font-family="ui-monospace, monospace" opacity="0.7">' + esc(hub.label) + "</text>";
      });
    } else {
      activeKinds.forEach(function (kind, ringIndex) {
        const radius = 150 + ringIndex * (activeKinds.length > 1 ? 160 / (activeKinds.length - 1) : 0);
        svg += '<circle cx="' + VIEW.cx + '" cy="' + VIEW.cy + '" r="' + radius + '" fill="none" stroke="rgba(34,211,238,0.12)" stroke-width="1"></circle>';
      });
      localPoints.forEach(function (node) {
        svg += '<line x1="' + VIEW.cx + '" y1="' + VIEW.cy + '" x2="' + node.x + '" y2="' + node.y + '" stroke="rgba(34,211,238,0.22)" stroke-width="1"></line>';
      });
    }
    if (world && linkNode) {
      related.spokes.forEach(function (id) {
        const other = worldMap.byId[id];
        if (!other) return;
        svg += '<line x1="' + linkNode.x + '" y1="' + linkNode.y + '" x2="' + other.x + '" y2="' + other.y + '" stroke="' + (KIND_COLOR[other.kind] || "#67e8f9") + '" stroke-width="1" opacity="0.42"></line>';
      });
      related.links.forEach(function (pair, i) {
        const a = worldMap.byId[pair[0]], b = worldMap.byId[pair[1]];
        if (!a || !b) return;
        svg += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="rgba(251,191,36,0.35)" stroke-width="1"></line>';
      });
    }
    if (!world) {
      graph.links.forEach(function (pair) {
        const a = localById[pair[0]], b = localById[pair[1]];
        if (!a || !b) return;
        svg += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="rgba(251,191,36,0.28)" stroke-width="1"></line>';

    }
    field.points.forEach(function (node) {
      const color = KIND_COLOR[node.kind] || "#67e8f9";
      const lit = hot === node.id;
      const peeked = node.id === peekId;
      const pinned = Boolean(selectedId) && node.id === selectedId;
      const frozen = node.id === linkId;
      const tied = Boolean(linkId) && (related.ids[node.id] || frozen);
      const dim = world && linkId && !peeked && !tied;
      const base = world ? (peeked || frozen ? 6 : tied ? 4.2 : pinned ? 4.5 : 2.6) : (peeked ? 9 : 7);
      const grow = magScale(node, cursorRef.current);
      const r = base * grow;

  function applySceneStyle() {

  function pickTarget(clientX, clientY) {

        if (clientX < left || clientX > right || clientY < box.top - 18 || clientY > box.bottom + 18) return;
        const score = Math.hypot(clientX - (box.left + box.width / 2), clientY - (box.top + box.height / 2));
        if (score < bestScore) { best = { level: row.level, side: side }; bestScore = score; }

  function measurePose(level, side) {
    const camera = root.querySelector(".vv-camera");

    function round(v) { return Math.round(v * 100) / 100; }

      level: level, side: side,
      originX: round(nodeCx - sceneBox.left), originY: round(nodeCy - sceneBox.top),
      x: round((cam.left + cam.width / 2) - nodeCx), y: round((cam.top + cam.height / 2) - nodeCy),
      scale: round(Math.min(4.4, Math.max(2.4, fit))),

  function goLevel(id, side) {

  function clientToSvg(clientX, clientY) {
    const svg = document.getElementById("field-svg");
    if (!svg) return null;
    const ctm = svg.getScreenCTM && svg.getScreenCTM();
    if (ctm && typeof ctm.inverse === "function") {
      const inv = ctm.inverse();
      return { x: inv.a * clientX + inv.c * clientY + inv.e, y: inv.b * clientX + inv.d * clientY + inv.f, px: Math.hypot(ctm.a, ctm.b) };
    }
    const rect = svg.getBoundingClientRect();
    const pg = page();
    const k = S.cam.k;
    const vbW = pg.world ? WORLD.w / k : VIEW.w;
    const vbH = pg.world ? WORLD.h / k : VIEW.h;
    const scale = Math.min(rect.width / Math.max(vbW, 1), rect.height / Math.max(vbH, 1));
    const originX = pg.world ? S.cam.x : 0;
    const originY = pg.world ? S.cam.y : 0;
    return {
      x: originX + (clientX - rect.left - (rect.width - vbW * scale) / 2) / scale,
      y: originY + (clientY - rect.top - (rect.height - vbH * scale) / 2) / scale,

  function zoomAt(clientX, clientY, factor) {
    const svg = document.getElementById("field-svg");

      const id = el.getAttribute("data-id");
      el.onmouseenter = function () { setHotNode(id); };
      el.onmouseleave = function () { if (S.hot === id) setHotNode(null); };
    });
  }

  function openFocusTab(id) {
    if (!id || !DATA.nodes[id]) return;
    const current = page();
    if (current && !current.blankWorld && current.focusId === id) return;
    S.hot = null;
    cursorRef.current = null;
    lastTapRef.current = { t: 0, id: null };
    const existing = S.pages.findIndex(function (item) { return !item.blankWorld && item.focusId === id; });
    if (existing >= 0) { S.pageI = existing; render(); return; }
    S.pages = S.pages.concat([makePage(id)]);
    S.pageI = S.pages.length - 1;
    render();
  }

  function bind() {
    const proj = document.getElementById("proj");
    if (proj) proj.onchange = function () { S.project = proj.value; S.active = null; S.focusId = null; render(); };
    bindLandingCamera();
    bindFocusField();
    bindKindList();
    const sep = document.getElementById("sep");
    if (sep) {
      sep.onpointerdown = function (e) {
        if (e.button !== 0) return;
        resizeRef.current = { x: e.clientX, width: S.panelW, last: S.panelW };
        sep.setPointerCapture(e.pointerId);
      };
      sep.onpointermove = function (e) {
        const drag = resizeRef.current;
        if (!drag) return;
        const next = clampPanel(drag.width + (e.clientX - drag.x));
        drag.last = next;
        S.panelW = next;
        const copy = document.getElementById("copy");
        if (copy) copy.style.width = next + "px";
      };
      sep.onpointerup = function (e) {
        const last = (resizeRef.current && resizeRef.current.last) || S.panelW;
        resizeRef.current = null;
        if (sep.hasPointerCapture(e.pointerId)) sep.releasePointerCapture(e.pointerId);
        try { sessionStorage.setItem(PANEL_KEY, String(last)); } catch (err) {}
      };
      sep.ondblclick = function () {
        S.panelW = PANEL_DEFAULT;
        try { sessionStorage.setItem(PANEL_KEY, String(PANEL_DEFAULT)); } catch (err) {}
        const copy = document.getElementById("copy");
        if (copy) copy.style.width = PANEL_DEFAULT + "px";
      };
    }
    const note = root.querySelector("[data-role=note]");
    if (note) note.oninput = function () { S.note = note.value; };
    root.ondblclick = function (ev) {
      const t = ev.target.closest("[data-open-tab]");
      if (!t) return;
      ev.preventDefault();
      openFocusTab(t.getAttribute("data-id"));
    };
    root.onclick = function (ev) {
      const t = ev.target.closest("[data-act]");
      if (!t) return;
      const act = t.getAttribute("data-act");
      if (act === "world") {
        const id = worldStartId(buildIndex());
        if (!id) return;
        openFocus(id, true);
      } else if (act === "back") backLanding();
      else if (act === "pane") { S.pane = t.getAttribute("data-pane"); S.filter = "All"; S.reviewing = false; render(); }
      else if (act === "filter") { S.filter = t.getAttribute("data-val"); render(); }
      else if (act === "review") { S.reviewing = true; S.reviewI = 0; S.note = ""; render(); }
      else if (act === "close-review") { S.reviewing = false; render(); }
      else if (act === "rev") {
        const row = rowOf(S.active);
        const kinds = LEFT_KINDS[S.active] || [];
        const items = S.filter === "All" ? withChecks(byKinds(kinds), checksOf(S.active)) : withChecks(byKinds(kinds), checksOf(S.active)).filter(function (it) { return it.kind === S.filter; });
        const q = queueFor(items);
        if (!q.length) return;
        S.reviewI = (S.reviewI + Number(t.getAttribute("data-d")) + q.length) % q.length;
        const cur = q[S.reviewI];
        const marks = loadReviewMarks();
        S.note = (cur && marks[cur.id] && marks[cur.id].note) || "";
        render();
      } else if (act === "verdict") {
        const row = rowOf(S.active);
        const kinds = LEFT_KINDS[S.active] || [];
        const items = S.filter === "All" ? withChecks(byKinds(kinds), checksOf(S.active)) : withChecks(byKinds(kinds), checksOf(S.active)).filter(function (it) { return it.kind === S.filter; });
        const q = queueFor(items);
        const current = q[S.reviewI];
        if (!current) return;
        saveReviewMark(current.id, { verdict: t.getAttribute("data-val"), note: S.note });
        if (S.reviewI < q.length - 1) S.reviewI += 1;
        const next = q[S.reviewI];
        const marks = loadReviewMarks();
        S.note = (next && marks[next.id] && marks[next.id].note) || "";
        render();
      } else if (act === "focus") {
        const id = t.getAttribute("data-id");
        openFocus(id, false);
      } else if (act === "unfocus") {
        S.focusId = null;
        S.startWorld = false;
        S.pages = [];
        S.hot = null;
        cursorRef.current = null;
        render();
      } else if (act === "toggle-world") {
        patchPage(function (item) {
          if (item.world) return { world: false, linkId: null };
          return { world: true, section: "Connections" };
        });
        S.cam = { x: 0, y: 0, k: 1 };
        S.hot = null;
        cursorRef.current = null;
        render();
      } else if (act === "tab") { patchPage({ section: t.getAttribute("data-tab") }); render(); }
      else if (act === "page") { S.pageI = Number(t.getAttribute("data-i")); S.hot = null; cursorRef.current = null; render(); }
      else if (act === "close-page") {
        const i = Number(t.getAttribute("data-i"));
        if (i <= 0) return;
        S.pages = S.pages.filter(function (_, idx) { return idx !== i; });
        if (S.pageI === i) S.pageI = Math.max(0, i - 1);
        else if (S.pageI > i) S.pageI -= 1;
        S.hot = null;
        cursorRef.current = null;
        render();
      } else if (act === "peek") {
        const id = t.getAttribute("data-id");
        if (page().world && DATA.nodes[id]) openFocusTab(id);
        else applyPeek(id);
      } else if (act === "clear-peek") { patchPage({ peekId: null, linkId: null }); S.hot = null; cursorRef.current = null; render(); }
      else if (act === "goto") {
        const id = page().peekId;
        if (!id || !DATA.nodes[id]) return;
        if (S.pageI === 0) openFocusTab(id);
        else { patchPage({ focusId: id, peekId: null, world: false, blankWorld: false, linkId: null, section: "Connections" }); S.hot = null; render(); }
      } else if (act === "see-link") {
        const peekId = page().peekId;
        patchPage(function (item) { return { linkId: item.linkId === peekId ? null : peekId }; });
        render();
      } else if (act === "open-file") {
        S.openFile = { path: t.getAttribute("data-path"), symbol: t.getAttribute("data-symbol") || "" };
        render();
      } else if (act === "zoom") {
        const svg = document.getElementById("field-svg");
        if (!svg) return;
        const rect = svg.getBoundingClientRect();
        zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, Number(t.getAttribute("data-k")));
      } else if (act === "fit") {
        S.cam = { x: 0, y: 0, k: 1 };
        const svg = document.getElementById("field-svg");
        if (svg) svg.setAttribute("viewBox", "0 0 " + WORLD.w + " " + WORLD.h);
        paintMagnify();
        paintHud();
      }
    };
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (S.focusId) { S.focusId = null; S.startWorld = false; render(); }
    else if (S.active) backLanding();
  });
  try {
    const saved = Number(sessionStorage.getItem(PANEL_KEY));
    if (Number.isFinite(saved)) S.panelW = clampPanel(saved);
  } catch (err) {}
  render();
})();
</script>
</body>
</html>
